<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="pr-title-lg">
  <title id="pr-title-lg">PathReader AI</title>
  <defs>
    <linearGradient id="roadGradLg" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="60%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#93c5fd"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="400" fill="#f7f9fc"/>

  <!-- Logo mark -->
  <g transform="translate(280, 200)">
    <path d="M -72 -90 L 40 -90 L 110 0 L 40 90 L -72 90 Q -98 90 -98 64 L -98 -64 Q -98 -90 -72 -90 Z"
          fill="#1e3a8a"/>
    <clipPath id="chevClipLg">
      <path d="M -72 -90 L 40 -90 L 110 0 L 40 90 L -72 90 Q -98 90 -98 64 L -98 -64 Q -98 -90 -72 -90 Z"/>
    </clipPath>
    <g clip-path="url(#chevClipLg)">
      <path d="M -95 72 Q -60 50 -30 24 Q 0 -2 28 -28 Q 58 -56 88 -78"
            fill="none" stroke="url(#roadGradLg)" stroke-width="36" stroke-linecap="round"/>
      <path d="M -95 72 Q -60 50 -30 24 Q 0 -2 28 -28 Q 58 -56 88 -78"
            fill="none" stroke="#ffffff" stroke-width="11" stroke-linecap="round" opacity="0.65"/>
    </g>
    <line x1="68" y1="-62" x2="100" y2="-88" stroke="#1e3a8a" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="68" y1="-62" x2="108" y2="-44" stroke="#1e3a8a" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="100" y1="-88" x2="108" y2="-44" stroke="#1e3a8a" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="68"  cy="-62" r="7" fill="#1e3a8a"/>
    <circle cx="100" cy="-88" r="7" fill="#1e3a8a"/>
    <circle cx="108" cy="-44" r="7" fill="#1e3a8a"/>
  </g>

  <!-- Company name -->
  <text x="418" y="188"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="52" font-weight="700" letter-spacing="-0.5">
    <tspan fill="#1e3a8a">PathReader</tspan><tspan fill="#3b82f6"> AI</tspan>
  </text>

  <!-- Tagline -->
  <text x="418" y="228"
        fill="#6b7280"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="15" font-weight="400">Deterministic policy compliance for AI agents</text>
</svg>
